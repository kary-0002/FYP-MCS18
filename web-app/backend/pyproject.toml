[project]
name = "backend"
version = "0.1.0"
description = "Backend for MCS18 - SeizureAI web app using Python and FastAPI"
readme = "README.md"
requires-python = ">=3.11,<3.14"
dependencies = [
    "fastapi[standard]>=0.139.2",
    "python-multipart>=0.0.32",
    "torch",
    "numpy",
    "scipy",
    "pyedflib",
    # EEG report generation
    "tensorflow",
    "google-genai",
    "mne",
    "python-dotenv",
    "matplotlib",
    "pillow",
    "pyod",
    "pandas",
    "scikit-learn",
    "PyWavelets",
    "beautifulsoup4",
    "fpdf2",
    "dit",
    "librosa",
    "statsmodels",
    "pyinform",
    "pymatreader",
    "markdown",
    "tqdm",
    "nicolet-e2edf>=0.4.2",
]
